animals:
  - DO79
  - DO80
  - DO81
  - DO95
  - DO96

pkl_filts:
  - 'batch_ABCD_ABBA_unit_zscore_ephys_2401_2504'

window: [-0.5, 1.5]
plot_window: [-0.25, 1]
decoding_window: [[0.5,1]]

all_v_all_decoding:
  # pips2decode: [['A-0', 'B-0','C-0','D-0']]
  pips2decode: [['A-0', 'A-1','A-2','A-3']]
  decoding_kwargs:
    dec_kwargs:
      cv_folds: 5  
      n_runs: 1
  decoding_window: [[0.15,0.25]]

all_v_all_cm_kwargs:
  # labels: ['A','B','C','D']
  labels: ['A1','A2','A3','A4']
  im_kwargs:
    cmap: RdBu_r
    vmin: 0.1
    vmax: 0.4
  cbar: false
  xlabel: "Predicted"
  ylabel: "True"
  title: ""
  figsize: [2, 2]


pips_2_plot:
  - A-0
  - A-1
  - A-2
  - A-3
  # - trial_start

generalisation_pca:
  pcas2plot: [[0,1,2], [0,1,3],[1,2,3],]
  plot_kwargs:
    plot_out_event: false
    t_end: 1
    smoothing: 3
    scatter_times: [0.5]
    align_trajs: False
    align_window: [0.0,0.5]
    align_ref_idx: 2
    align_pip_grouping: [0]
    plot_pip_grouping: [0]
    plot_group: 'individual'
    indiv_alpha: 1
  fig_kwargs:
    figsize: [2.5,1.8]
  pcas2scatter: [[1,3],[0,1],[1,2],]

generalisation_pca_by_animal:
  pcas2plot: [[0,1,2], [0,1,3],[1,2,3],]
  plot_kwargs:
    plot_out_event: true
    t_end: 1.25
    t0_time: 0
    lw: 1
    smoothing: 5
    scatter_times: [0.5]
    scatter_kwargs:
      size: 40
    align_trajs: true
    align_method: 'orthogonal'
    align_window: [0,1.5]
    # align_pip_grouping: [0]
    align_pip_grouping: [-1]
    plot_pip_grouping: [0]
    plot_group: 'mean_sem'
    indiv_alpha: 0.8
    # sem_mode: 'ellipses'
    ellipse_every: 5
    # align_pip_grouping: none
  fig_kwargs:
    figsize: [2.5,2.2]
  pcas2scatter: [[1,3],[0,1],[1,2],[0,3]]

psth_figdir: 'X:\Dammy\figures\psth_plots_aggr_sessions_ephys_2401_2504'
decoding_figdir: 'X:\Dammy\figures\decoding_plots_aggr_sessions_ephys_2401_2504'
plot_suffix: psth.pdf
psth_plot_kwargs:
  sort_window: [0.1, 1]
  plot_window: [-0.25, 1]
  im_kwargs:
    vcenter: 0
    vmin: -0.75
    vmax: 0.75
    cmap: RdBu_r
ts_mean_plot_kwargs:
  plot_window: [-0.25, 1.5]
  im_kwargs:
    lw: 0.5

by_animals: false
session_topology_paths: 
  - X:\Dammy\Xdetection_mouse_hf_test\session_topology_ephys_2401.csv
  - X:\Dammy\Xdetection_mouse_hf_test\session_topology_ephys_2504.csv
sess_top_query: 'sess_order=="main"'
td_df_query: 'Stage==5'
cond_filter: none
overwrite: true
plot_config_path: null
