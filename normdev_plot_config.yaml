animals:
  - DO79
  - DO80
  - DO81
  - DO95
  - DO96
  - DO97

pkl_filts:
  # - 'batch_resps_ephys_2401'
  - 'batch_normdev_resps_ephys_2401_2504'

window: [-0.5, 1.5]
plot_window: [-0.25, 1]
decoding_window: [[0.5,1.49]]

normdev_decoding:
  # pips2decode: [['A-0_normal', 'A-1_deviant_C']]
  pips2decode: [['A-0', 'A-1']]

  decoding_window: [[0.5,1.49]]
  decoding_kwargs:
    dec_kwargs:
      cv_folds: 0  
      n_runs: 100

normdev_mean_ts:
  figsize: [2,1.5]
  smoothing: 25
  plot_smoothed_ts: true
  ts_plot_window: [-0.25,1.5]

normdev_pca:
  pcas2plot: [[0,1,3],[0,1,2],[1,3,4],[0,1,4]]
  plot_kwargs:
    plot_out_event: false
    t_end: 1
    scatter_times: [0.5]
    align_trajs: true
    align_window: [-0.1,0.1]
    scatter_kwargs:
      marker: '*'
      s: 50
      c: 'k'

  fig_kwargs:
    figsize: [2.5,1.8]


pips_2_plot:
  - A-0
  - A-1
  # - trial_start
psth_figdir: 'X:\Dammy\figures\psth_plots_aggr_sessions_ephys_2401_2504'
decoding_figdir: 'X:\Dammy\figures\decoding_plots_aggr_sessions_ephys_2401_2504'
plot_suffix: psth.pdf
psth_plot_kwargs:
  sort_window: [0.1, 1]
  plot_window: [-0.25, 1]
  im_kwargs:
    vcenter: 0
    vmin: -0.75
    vmax: 0.75
    cmap: RdBu_r
ts_mean_plot_kwargs:
  plot_window: [-0.25, 1.5]
  im_kwargs:
    lw: 0.5

by_animals: false
session_topology_paths: 
  - X:\Dammy\Xdetection_mouse_hf_test\session_topology_ephys_2504.csv
  - X:\Dammy\Xdetection_mouse_hf_test\session_topology_ephys_2401.csv
sess_top_query: 'sess_order=="main"'
td_df_query: 'Stage==4'
cond_filter: "deviant_C"
overwrite: true
plot_config_path: null

excluded_sessions:
  - DO79_240227a
  - DO79_240215a
  - DO96_250604c
  
colors: ["#333333ff", "#cd2828ff", "#0000ff", "#ff00ff"]